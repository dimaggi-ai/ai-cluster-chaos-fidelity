name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Lint the chaos experiment catalog
        run: python3 catalog/validate.py
      - name: Prove wrong specs are rejected
        run: python3 catalog/test_validate.py
      - name: Coverage vs the published failure taxonomy
        run: |
          cd catalog
          python3 coverage.py
          python3 test_coverage.py
