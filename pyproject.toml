[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cluster-chaos-fidelity"
version = "1.0.1"
description = "A machine-checkable standard for AI-cluster chaos-engineering fidelity: which fault injection tests which layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Margaret Nanyonga" }]
keywords = ["chaos-engineering", "fault-injection", "fidelity", "gpu-cluster", "reliability"]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/dimaggi-ai/ai-cluster-chaos-fidelity"

[project.scripts]
chaos-fidelity = "catalog.validate:cli"

[tool.setuptools]
packages = ["catalog"]

[tool.setuptools.package-data]
catalog = ["experiments/*.yaml"]
